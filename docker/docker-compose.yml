name: simba

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${IMAGE_NAME:-simba}:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - DEVICE=${DEVICE:-cpu}
      - OLLAMA_HOST=http://ollama:11434
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-simba}
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-litedb}
    volumes:
      - ../config.yaml:/app/config.yaml
      - ../uploads:/app/uploads:rw
      - ../markdown:/app/markdown:rw
      - ../vector_stores:/app/vector_stores:rw
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - simba_network
    runtime: ${RUNTIME:+${RUNTIME}}
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["python", "-m", "uvicorn", "simba.__main__:create_app", "--host", "0.0.0.0", "--port", "8000", "--factory"]

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${IMAGE_NAME:-simba}:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEVICE=${DEVICE:-cpu}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-simba}
    volumes:
      - ../config.yaml:/app/config.yaml
      - ../uploads:/app/uploads:rw
      - ../vector_stores:/app/vector_stores:rw
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - simba_network
    runtime: ${RUNTIME:+${RUNTIME}}
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["celery", "-A", "simba.core.celery_config.celery_app", "worker", "--loglevel=info", "-Q", "parsing"]

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - simba_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-simba}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - simba_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE_NAME:-simba-frontend}:${FRONTEND_IMAGE_TAG:-latest}
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - simba_network

  ollama:
    image: ollama/ollama:latest
    restart: always
    environment:
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - simba_network
    runtime: ${RUNTIME:+${RUNTIME}}
    profiles:
      - ${RUN_OLLAMA:-default}

networks:
  simba_network:
    name: simba_network
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  ollama_models:
