<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5}
.hdr{background:linear-gradient(135deg,#e0f2fe,#f1f5f9);padding:1.5rem 2rem;border-bottom:1px solid #e2e8f0}
.hdr h1{font-size:1.4rem;font-weight:700;color:#0f172a}.hdr p{color:#64748b;font-size:.82rem;margin-top:.15rem}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:100;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tab{padding:.7rem 1.3rem;cursor:pointer;font-size:.8rem;font-weight:500;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.15s}
.tab:hover{color:#1e293b}.tab.on{color:#0284c7;border-color:#0284c7}
.ct{max-width:1400px;margin:0 auto;padding:1.25rem}
.hero-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.hero-grid{grid-template-columns:1fr}}
.hero{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1.2rem;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;transition:box-shadow .15s,border-color .15s}
.hero:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);border-color:#cbd5e1}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.hero .chain{font-size:.78rem;color:#64748b;margin-bottom:.2rem}
.hero .val{font-size:1.8rem;font-weight:700;color:#0f172a;line-height:1.1}
.hero .lbl{font-size:.72rem;color:#64748b;margin-top:.15rem}
.hero .delta{font-size:.78rem;font-weight:600;margin-top:.3rem}
.hero .delta.pos{color:#16a34a}.hero .delta.neg{color:#dc2626}
.hero .cta{font-size:.72rem;color:#0284c7;margin-top:.4rem;font-weight:500}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.75rem;margin-bottom:2rem}
.ins{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ins .itag{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:.4rem}
.ins .itag.profit{background:rgba(22,163,74,.1);color:#16a34a}
.ins .itag.income{background:rgba(2,132,199,.1);color:#0284c7}
.ins .itag.env{background:rgba(202,138,4,.1);color:#ca8a04}
.ins .itag.social{background:rgba(124,58,237,.1);color:#7c3aed}
.ins h4{font-size:.85rem;font-weight:600;color:#0f172a;margin-bottom:.2rem}
.ins p{font-size:.78rem;color:#64748b;line-height:1.45}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
@media(max-width:900px){.cc-grid{grid-template-columns:1fr}}
.cc{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1.2rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cc h3{font-size:.9rem;font-weight:600;color:#0f172a;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
.cc h3 .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cc canvas{max-height:220px}
.kpi-sec{margin-bottom:2rem}
.kpi-head{display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem;background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:1rem}
.kpi-head .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.kpi-head .kpi-name{font-size:.95rem;font-weight:600;color:#0f172a}
.kpi-head .kpi-count{font-size:.72rem;color:#64748b;margin-left:auto;background:#f1f5f9;padding:2px 8px;border-radius:10px}
.ind-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;margin-bottom:.75rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}
@media(max-width:900px){.ind-card{grid-template-columns:1fr}}
.ind-card .ind-title{font-size:.85rem;font-weight:600;color:#0f172a}
.ind-card .ind-unit{font-size:.72rem;color:#64748b;margin-bottom:.4rem}
.ind-card canvas{max-height:170px}
.ind-card .ind-tbl{width:100%;font-size:.73rem;border-collapse:collapse}
.ind-card .ind-tbl th{text-align:left;padding:.3rem .4rem;color:#475569;font-weight:500;border-bottom:1px solid #e2e8f0;font-size:.66rem;text-transform:uppercase}
.ind-card .ind-tbl td{padding:.25rem .4rem;border-bottom:1px solid #f1f5f9}
.b{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.64rem;font-weight:500}
.bc{background:rgba(22,163,74,.1);color:#16a34a}.bi{background:rgba(124,58,237,.1);color:#7c3aed}
.bb{background:rgba(2,132,199,.1);color:#0284c7}.bw{background:rgba(217,119,6,.1);color:#d97706}
.sec{font-size:1rem;font-weight:700;margin:1.5rem 0 .75rem;padding-bottom:.4rem;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:.5rem;color:#0f172a}
.sec .dot{width:8px;height:8px;border-radius:50%}
.chain-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.5rem;margin-bottom:1rem}
.chain-pill{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:.5rem .7rem;font-size:.75rem;display:flex;align-items:center;gap:.4rem}
.chain-pill .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tbl-wrap{overflow-x:auto;margin-bottom:.5rem}
.tbl{width:100%;border-collapse:collapse;font-size:.75rem}
.tbl th{text-align:left;padding:.4rem .5rem;color:#475569;font-weight:500;border-bottom:2px solid #e2e8f0;font-size:.68rem;text-transform:uppercase;background:#fff;position:sticky;top:0}
.tbl td{padding:.35rem .5rem;border-bottom:1px solid #f1f5f9}
.tbl tr:hover td{background:#f8fafc}
.cta-link{display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;font-weight:500;color:#0284c7;cursor:pointer;padding:.4rem .8rem;border:1px solid #e2e8f0;border-radius:6px;background:#fff;transition:.15s;text-decoration:none}
.cta-link:hover{background:#e0f2fe;border-color:#0284c7}
</style></head><body>

function indCard(ind,idx,kpiName,cp){

}

h+='<div class="cc"><h3><span class="cdot" style="background:#16a34a"></span>Cooperative vs Independent Gap</h3><canvas id="oGap"></canvas></div>';
h+='</div>';

// ---- CHAIN QUICK VIEW ----
h+='<div class="sec"><span class="dot" style="background:#0284c7"></span>Explore Each Chain</div>';
h+='<div class="hero-grid">';
chains.forEach((n,i)=>{
const items=D[n];const bk=byKPI(items);const indCnt=byInd(items).length;
h+='<div class="hero" onclick="switchTab(\''+CK[n.replace(/ /g,'_').toLowerCase().replace(/-/g,'_')]+'\')">';
h+='<div style="position:absolute;top:0;left:0;right:0;height:3px;background:'+colors[i]+'"></div>';
h+='<div class="chain">'+n+'</div>';
h+='<div class="val" style="font-size:1.3rem">13 KPIs</div>';
h+='<div class="lbl">'+indCnt+' indicators with data \u00b7 '+items.length+' data points</div>';
h+='<div class="cta">View details \u2192</div>';
h+='</div>';
});
h+='</div>';

ct.innerHTML=h;

setTimeout(()=>{
// Radar
const riLabels=G.map(g=>g.split(' ')[0]);
const riDs=chains.map((n,i)=>{
const bi=byInd(D[n]);
const rev=bi.find(d=>/revenue/i.test(d.i)&&!/\(/.test(d.i));
return{label:n,data:G.map(g=>rev?.g[g]?.m||0),backgroundColor:colors[i]+'22',borderColor:colors[i],borderWidth:2};
});
CH.oR=new Chart($('oRadar'),{type:'radar',data:{labels:riLabels,datasets:riDs},options:cOpts()});

// Gap
const gLabels=[],gData=[],gColors=[];
chains.forEach(n=>{const bi=byInd(D[n]);
const profit=bi.find(d=>/profit/i.test(d.i)&&!/income/i.test(d.i)&&!/\(/.test(d.i));
const rev=bi.find(d=>/revenue/i.test(d.i)&&!/\(/.test(d.i));
if(profit){const cv=profit.g['Cooperative']?.m||0,iv=profit.g['Independent']?.m||0;
gLabels.push(n+': Profit');gData.push(cv-iv);gColors.push(cv>=iv?'rgba(22,163,74,.6)':'rgba(220,38,38,.6)');}
if(rev){const cv=rev.g['Cooperative']?.m||0,iv=rev.g['Independent']?.m||0;
gLabels.push(n+': Revenue');gData.push(cv-iv);gColors.push(cv>=iv?'rgba(22,163,74,.6)':'rgba(220,38,38,.6)');}
});
CH.oG=new Chart($('oGap'),{type:'bar',data:{labels:gLabels,datasets:[{data:gData,backgroundColor:gColors,borderColor:gColors.map(c=>c.replace('.6','.9')),borderWidth:1}]},options:{responsive:true,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#475569'},grid:{color:'#e2e8f0'}},y:{ticks:{color:'#475569',font:{size:10}}}}}});
},80);
}

function rChain(name){
const items=D[name];if(!items||!items.length)return;
const bk=byKPI(items);
const cp=name.replace(/[^a-z]/gi,'').toLowerCase();
let h='<div class="sec"><span class="dot" style="background:#0284c7"></span>'+name+' \u2014 Key Indicators Analysis</div>';
h+='<div class="chain-summary">';
KO.forEach(k=>{const cnt=bk[k]?.length||0;
h+='<div class="chain-pill" style="'+(cnt===0?'opacity:.45':'')+'"><span class="cdot" style="background:'+(KC[k]||'#64748b')+'"></span><b>'+k+'</b> <span>('+cnt+')</span></div>';
});
h+='</div>';
const cards=[];
KO.forEach(kpiName=>{
const kpiItems=bk[kpiName];
const inds=kpiItems?byInd(kpiItems):[];
const cnt=inds.length;
h+='<div class="kpi-sec">';
h+='<div class="kpi-head"><span class="dot" style="background:'+(KC[kpiName]||'#64748b')+'"></span><span class="kpi-name">'+kpiName+'</span><span class="kpi-count">'+(cnt?cnt+' indicators':'No data')+'</span></div>';
if(cnt===0){
h+='<div style="padding:1.5rem;text-align:center;color:#94a3b8;font-size:.85rem;border:1px dashed #e2e8f0;border-radius:8px;background:#fff">No data available for '+kpiName+' in '+name+'</div>';
}else{
inds.forEach((ind,i)=>{const r=indCard(ind,i,kpiName,cp);h+=r.html;if(r.hasNum)cards.push(r);});
}
h+='</div>';
});
ct.innerHTML=h;
cards.forEach(r=>{const el=$(r.cid);if(!el)return;const ind=r.ind;
CH[r.cid]=new Chart(el,{type:'bar',data:{labels:G.map(g=>g.split(' ')[0]),datasets:[{data:G.map(g=>ind.g[g]?.m||0),backgroundColor:G.map(g=>GC[g].c+'55'),borderColor:G.map(g=>GC[g].c),borderWidth:1}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#475569',font:{size:9}},grid:{display:false}},y:{ticks:{color:'#64748b'},grid:{color:'#f1f5f9'}}}}});
});
}

function rCompare(){
const chains=Object.keys(D);
let h='<div class="sec"><span class="dot" style="background:#7c3aed"></span>Cross-Chain Comparison by Key Indicator</div>';
KO.forEach(kpiName=>{
const hasData=chains.some(n=>byKPI(D[n])[kpiName]);
if(!hasData)return;
h+='<div class="kpi-sec">';
h+='<div class="kpi-head"><span class="dot" style="background:'+(KC[kpiName]||'#64748b')+'"></span><span class="kpi-name">'+kpiName+' \u2014 Across Chains</span></div>';
h+='<div class="tbl-wrap"><table class="tbl"><tr><th>Chain</th><th>Indicator</th><th>Unit</th><th>Worse-off</th><th>Better-off</th><th>Coop</th><th>Indep</th></tr>';
chains.forEach(ch=>{
const bk=byKPI(D[ch]);if(!bk[kpiName])return;
const bi=byInd(bk[kpiName]);
bi.forEach((m,i)=>{h+='<tr>';
if(i===0)h+='<td rowspan="'+bi.length+'" style="font-weight:600;white-space:nowrap">'+ch+'</td>';
h+='<td>'+m.i+'</td><td style="color:#64748b;white-space:nowrap">'+(m.u||'')+'</td>';
G.forEach(g=>{h+='<td style="font-weight:500">'+fmt(m.g[g]?.m)+'</td>';});
h+='</tr>';
});
});
h+='</table></div></div>';
});
ct.innerHTML=h;
}

switchTab('overview');

</script></body></html>
